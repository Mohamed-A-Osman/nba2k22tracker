AWSTemplateFormatVersion: '2010-09-09'
Description: Lets GitHub Actions in one repo deploy to this AWS account without stored keys.

Parameters:
  GitHubRepo:
    Type: String
    Description: owner/repo, e.g. Mohamed-A-Osman/nba2k22tracker
  Branch:
    Type: String
    Default: master

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: nba2k22-github-deploy
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Only workflows running on this repo's branch can use the role
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepo}:ref:refs/heads/${Branch}
      # SAM deploys create Lambda, API Gateway, S3, CloudFront, IAM roles and a budget.
      # Admin keeps this simple for a personal account; only the repo's branch can assume it.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

Outputs:
  DeployRoleArn:
    Description: Put this in the repo's AWS_DEPLOY_ROLE_ARN variable
    Value: !GetAtt DeployRole.Arn
