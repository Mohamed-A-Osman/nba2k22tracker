<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}2K22 Stat Tracker{% endblock %}</title>
<script src="{{ url_for('static', filename='theme.js') }}"></script>
<link rel="preload" href="{{ url_for('static', filename='fonts/anton-400.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ url_for('static', filename='fonts/barlow-400.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', filename='v2.css') }}">
<script src="{{ url_for('static', filename='v2.js') }}" defer></script>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="page">
  <div class="court-band" aria-hidden="true">
  <svg class="court" viewBox="0 0 860 860" fill="none" stroke-width="2">
    <circle cx="430" cy="430" r="190"></circle>
    <circle cx="430" cy="430" r="64"></circle>
    <path d="M40 430 H820"></path>
    <path d="M430 40 A390 390 0 0 1 820 430"></path>
  </svg>
  </div>

  <header class="topbar">
    <a class="wordmark" href="{{ url_for('v2.home') }}" aria-label="2K22 Stat Tracker home">
      <span class="display">2K22</span>
      <span class="wordmark-text">STAT TRACKER</span>
    </a>
    <nav class="nav" aria-label="Main">
      {% for endpoints, label in nav_items %}
      <a class="nav-link" href="{{ url_for(endpoints[0]) }}"{% if request.endpoint in endpoints %} aria-current="page"{% endif %}>{{ label }}</a>
      {% endfor %}
    </nav>
    <button class="icon-button theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
      <svg class="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
    </button>
  </header>

  <main id="main">
    {% block main %}{% endblock %}
  </main>

  <footer class="site-footer">
    <span>2K22 Stat Tracker · {{ site.games }} games of NBA 2K22 · {{ site.first_month }} to {{ site.last_month }}</span>
    <a href="{{ url_for('v1.home') }}">Previous version of the site</a>
  </footer>
</div>
</body>
</html>
